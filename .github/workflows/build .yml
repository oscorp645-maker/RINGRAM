name: Build RINGRAM APK

on:
  workflow_dispatch:   # Actions tabidan "Run workflow" tugmasi bilan ishga tushadi

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      APP_PACKAGE: uz.rin.ringram        # o'zingizning paket nomingiz

    steps:
      - name: Bo'sh joy ochish
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /opt/microsoft /usr/local/.ghcup
          sudo docker image prune --all --force || true
          # qo'shimcha xotira (swap), RAM yetmasligining oldini olish uchun
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile \
            && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true
          df -h /
          free -m

      - name: Repodagi kodni submodullari bilan olish
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK / NDK o'rnatish
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: api_id / api_hash / paket nomini qo'yish
        run: |
          # secret ichidagi ko'rinmas bo'sh joy/yangi qatorlarni olib tashlash
          API_ID="$(printf '%s' "$API_ID" | tr -d '[:space:]')"
          API_HASH="$(printf '%s' "$API_HASH" | tr -d '[:space:]')"
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "XATO: API_ID yoki API_HASH secret bo'sh yoki nomi noto'g'ri"; exit 1
          fi
          B=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${API_ID};/" $B
          sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"${API_HASH}\";/" $B
          sed -i "s/^APP_PACKAGE=.*/APP_PACKAGE=${APP_PACKAGE}/" gradle.properties
          # google-services.json dagi paket nomlarini moslash (push ishlamaydi, faqat yig'ish uchun)
          # kutubxona (TMessagesProj) o'z nomini saqlab qolishi kerak, shuning uchun uni o'tkazib yuboramiz
          find . -name google-services.json -not -path './TMessagesProj/*' -exec sed -i "s/org\.telegram\.messenger/${APP_PACKAGE}/g" {} +
          # ilova nomi (telefon ekranidagi nom): "Telegram" va "Telegram Beta" -> "RIN"
          S=TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="AppName">Telegram</string>|<string name="AppName">RIN</string>|; s|<string name="AppNameBeta">Telegram Beta</string>|<string name="AppNameBeta">RIN</string>|' $S
          grep -n 'name="AppName' $S
          # faqat zamonaviy telefonlar uchun (arm64-v8a): yig'ish 3-4 barobar tez va yengil
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
          grep -n 'abiFilters' TMessagesProj_App/build.gradle
          # bepul runner xotirasiga moslash
          sed -i "s/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/" gradle.properties
          grep -n "APP_ID =\|APP_PACKAGE" $B gradle.properties | sed "s/\"[0-9a-f]\{32\}\"/\"***\"/"

      - name: Tema - oltin-qora
        run: |
          # Kunduzgi tema: asosiy ko'k rang -> logotipdagi chuqur oltin (oq fonda o'qiladigan)
          C=TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ThemeColors.java
          sed -i 's/TELEGRAM_COLOR = 0xFF229AF0/TELEGRAM_COLOR = 0xFFA96501/; s/TELEGRAM_COLOR_TEXT = 0xFF298ACF/TELEGRAM_COLOR_TEXT = 0xFF8A500A/' $C
          grep -n 'TELEGRAM_COLOR' $C | head -3
          # Tungi temalar (Dark Blue va Night): ranglar logotipdan olingan, xabarlar yaltiroq oltin gradient
          cat > /tmp/gold.py <<'PY'
          import colorsys, re, sys

          # Ranglar logotipdan olingan
          GOLD = 0xFFFACC10        # yorqin oltin (logotipdagi eng yorqin to'yingan oltin)
          OVR = {
              'actionBarDefault': 0xFF0A0603,           # iliq qora (yuqori panel)
              # Premium yulduz va hikoya halqalari: binafsha/yashil o'rniga oltin
              'premiumStarGradient1': 0xFFFFE680,
              'premiumStarGradient2': 0xFFD4A017,
              'stories_circle1': 0xFFFFD700,
              'stories_circle2': 0xFFB8860B,
              'stories_circle_dialog1': 0xFFFFD700,
              'stories_circle_dialog2': 0xFFB8860B,
              'stories_circle_closeFriends1': 0xFFFFE680,
              'stories_circle_closeFriends2': 0xFFD4A017,
              'actionBarDefaultTitle': GOLD,            # panel sarlavhasi: oltin
              'actionBarDefaultIcon': GOLD,             # panel ikonkalari: oltin
              'chats_unreadCounterText': 0xFF000000,    # oltin ustidagi yozuv: qora
              'chats_actionIcon': 0xFF000000,
              'chats_actionPressedBackground': 0xFFD9A800,
              'actionBarActionModeDefault': 0xFF160B03,
              'chats_actionBackground': GOLD,           # suzuvchi tugma
              'chat_messagePanelSend': GOLD,            # yuborish tugmasi
              # men yozgan xabar: yaltiroq oltin gradient (logotipdagi yorqin -> chuqur oltin)
              'chat_outBubble': 0xFFFFE45E,
              'chat_outBubbleGradient': 0xFFFACC10,
              'chat_outBubbleGradient2': 0xFFE69A00,
              'chat_outBubbleSelected': 0xFFE0A800,
              'chat_messageTextOut': 0xFF1A1100,        # oltin ustida qora-jigarrang yozuv
              'chat_messageLinkOut': 0xFF5A3500,
              'chat_outSentCheckRead': 0xFF4A3000,
              'chat_outSentCheckReadSelected': 0xFF4A3000,
              'chat_inBubble': 0xFF1F1409,              # kelgan xabar: iliq to'q
              'chat_inBubbleSelected': 0xFF2B1B0C,
              'windowBackgroundWhite': 0xFF000000,      # asosiy fon: sof qora
              'dialogBackground': 0xFF160B03,
              'chats_menuBackground': 0xFF0A0603,
              'chat_messagePanelBackground': 0xFF0A0603,
          }
          def out_fg(key, val):
              # chat_out* (pufak rangidan tashqari) elementlari oltin fonda ko'rinishi uchun to'q jigarrang, shaffoflik saqlanadi
              if key.startswith('chat_out') and 'Bubble' not in key and 'Shadow' not in key and key not in OVR:
                  return (val & 0xFF000000) | 0x4A3000
              return None

          LINE = re.compile(r'^([A-Za-z0-9_]+)=(-?\d+)$')
          HEX = re.compile(r'^([A-Za-z0-9_]+)=#([0-9a-fA-F]{8})$')

          def recolor(u):
              a, r, g, b = (u >> 24) & 255, (u >> 16) & 255, (u >> 8) & 255, u & 255
              h, l, s = colorsys.rgb_to_hls(r / 255, g / 255, b / 255)
              hd = h * 360
              if s >= 0.12 and 170 <= hd <= 265:          # ko'k / zangori rang oilasi
                  if l < 0.30:                             # to'q fonlar -> iliq qora
                      h, s, l = 30 / 360, 0.35, l * 0.35
                  elif l < 0.50:                           # o'rta ohang -> bronza
                      h, s, l = 34 / 360, min(max(s, 0.60), 0.90), l * 0.80
                  else:                                    # urg'u rang -> oltin
                      h, s, l = 48 / 360, 0.95, max(l, 0.52)
                  r, g, b = [int(round(x * 255)) for x in colorsys.hls_to_rgb(h, l, s)]
                  return (a << 24) | (r << 16) | (g << 8) | b
              return u

          def conv(path):
              out, n, ov, seen = [], 0, 0, set()
              for line in open(path, encoding='utf-8', errors='surrogateescape').read().split('\n'):
                  mh = HEX.match(line)
                  if mh:
                      key, val = mh.group(1), int(mh.group(2), 16); seen.add(key)
                      new = OVR[key] if key in OVR else (out_fg(key, val) if out_fg(key, val) is not None else recolor(val))
                      if key in OVR: ov += 1
                      if new != val: n += 1
                      out.append(f'{key}=#{new:08x}')
                      continue
                  m = LINE.match(line)
                  if m:
                      key, val = m.group(1), int(m.group(2)) & 0xFFFFFFFF; seen.add(key)
                      new = OVR[key] if key in OVR else (out_fg(key, val) if out_fg(key, val) is not None else recolor(val))
                      if key in OVR: ov += 1
                      if new != val: n += 1
                      if new >= 2**31: new -= 2**32
                      line = f'{key}={new}'
                  out.append(line)
              while out and out[-1] == '':
                  out.pop()
              for key, new in OVR.items():
                  if key not in seen:
                      out.append(f'{key}=#{new:08x}'); ov += 1
              out.append('')
              open(path, 'w', encoding='utf-8', errors='surrogateescape').write('\n'.join(out))
              print(path, "o'zgargan:", n, 'maxsus:', ov)

          for p in sys.argv[1:]:
              conv(p)
          PY
          python3 /tmp/gold.py TMessagesProj/src/main/assets/darkblue.attheme TMessagesProj/src/main/assets/night.attheme

      - name: Fon rasmi (saroy) va splash (logotip)
        run: |
          R=TMessagesProj/src/main/res
          test -f .github/rin/wallpaper.jpg && test -f .github/rin/splash.png
          # Chat foni: temalar fayliga WPS bo'limi sifatida rasm qo'shiladi. Rasm ishlashi uchun tekis chat_wallpaper rangi olib tashlanadi
          python3 - <<'PY'
          wp = open('.github/rin/wallpaper.jpg', 'rb').read()
          for n in ('darkblue', 'night'):
              p = f'TMessagesProj/src/main/assets/{n}.attheme'
              data = open(p, 'rb').read().decode('utf-8', 'surrogateescape')
              lines = [l for l in data.split('\n') if l and not l.startswith('chat_wallpaper')]
              out = ('\n'.join(lines) + '\nWPS\n').encode('utf-8', 'surrogateescape') + wp + b'\nWPE\n'
              open(p, 'wb').write(out)
              print(p, 'qatorlar:', len(lines), 'fon:', len(wp) // 1024, 'KB')
          PY
          # Splash (Android 12+): Telegram samolyoti o'rniga logotip
          mkdir -p $R/drawable-nodpi
          cp .github/rin/splash.png $R/drawable-nodpi/rin_splash.png
          sed -i 's|@drawable/tg_splash_320|@drawable/rin_splash|g' $R/values-v31/styles.xml
          grep -n 'rin_splash' $R/values-v31/styles.xml

      - name: Boshlang'ich tema - qora fon
        run: |
          T=TMessagesProj/src/main/java/org/telegram/ui/ActionBar/Theme.java
          # Yangi o'rnatilgan ilova darhol qora-oltin ("Dark Blue" asosidagi) temada ochiladi
          sed -i 's/preferences.getString("theme", null)/preferences.getString("theme", "Dark Blue")/' $T
          grep -n 'getString("theme"' $T
          # Ishga tushish oynasi (splash) oq o'rniga qora
          R=TMessagesProj/src/main/res
          for f in $R/values/styles.xml $R/values-v21/styles.xml $R/values-v31/styles.xml; do
            sed -i '/name="Theme.TMessages.Start"/,/<\/style>/ s|@android:color/white|@android:color/black|g' $f
          done
          sed -i '/name="Theme.TMessages.Start"/,/<\/style>/ s|<item name="android:windowBackground">#1f2732</item>|<item name="android:windowBackground">#000000</item>|' $R/values-night/styles.xml
          grep -n -A8 'name="Theme.TMessages.Start"' $R/values/styles.xml | grep -E 'windowBackground|colorBackground'

      - name: APK yig'ish
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :TMessagesProj_App:assembleAfatDebug

      - name: Xato bo'lsa - tizim holati
        if: failure()
        run: |
          df -h /
          free -m
          sudo dmesg | tail -n 25 || true

      - name: APK ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ringram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          retention-days: 7
