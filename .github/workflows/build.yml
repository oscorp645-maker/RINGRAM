name: Build RINGRAM APK

on:
  workflow_dispatch:   # Actions tabidan "Run workflow" tugmasi bilan ishga tushadi

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      APP_PACKAGE: uz.rin.ringram        # o'zingizning paket nomingiz

    steps:
      - name: Bo'sh joy ochish
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /opt/microsoft /usr/local/.ghcup
          sudo docker image prune --all --force || true
          # qo'shimcha xotira (swap), RAM yetmasligining oldini olish uchun
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile \
            && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true
          df -h /
          free -m

      - name: Repodagi kodni submodullari bilan olish
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK / NDK o'rnatish
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: api_id / api_hash / paket nomini qo'yish
        run: |
          # secret ichidagi ko'rinmas bo'sh joy/yangi qatorlarni olib tashlash
          API_ID="$(printf '%s' "$API_ID" | tr -d '[:space:]')"
          API_HASH="$(printf '%s' "$API_HASH" | tr -d '[:space:]')"
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "XATO: API_ID yoki API_HASH secret bo'sh yoki nomi noto'g'ri"; exit 1
          fi
          B=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${API_ID};/" $B
          sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"${API_HASH}\";/" $B
          sed -i "s/^APP_PACKAGE=.*/APP_PACKAGE=${APP_PACKAGE}/" gradle.properties
          # google-services.json dagi paket nomlarini moslash (push ishlamaydi, faqat yig'ish uchun)
          find . -name google-services.json -exec sed -i "s/org\.telegram\.messenger/${APP_PACKAGE}/g" {} +
          # faqat zamonaviy telefonlar uchun (arm64-v8a): yig'ish 3-4 barobar tez va yengil
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
          grep -n 'abiFilters' TMessagesProj_App/build.gradle
          # bepul runner xotirasiga moslash
          sed -i "s/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/" gradle.properties
          grep -n "APP_ID =\|APP_PACKAGE" $B gradle.properties | sed "s/\"[0-9a-f]\{32\}\"/\"***\"/"

      - name: APK yig'ish
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :TMessagesProj_App:assembleAfatDebug

      - name: Xato bo'lsa - tizim holati
        if: failure()
        run: |
          df -h /
          free -m
          sudo dmesg | tail -n 25 || true

      - name: APK ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ringram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          retention-days: 7
